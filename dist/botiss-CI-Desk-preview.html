<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Preview copy of the botiss CI Desk, for review.">
<title>botiss CI Desk — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* The artifact host normally supplies these few lines. */
  :root{color-scheme:light dark}
  html{-webkit-text-size-adjust:100%}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* ============================================================
   botiss CI Desk — field competitive intelligence
   Palette: clinical teal (brand) on a teal-biased neutral ground.
   Chart hues validated for CVD separation in both themes.
   ============================================================ */

:root{
  /* neutrals — grey biased toward the teal accent, not inherited grey */
  --ground:#EDF2F2;
  --surface:#FFFFFF;
  --surface-2:#F6F9F9;
  --sunk:#E3EAEA;
  --line:#D3DEDE;
  --line-soft:#E6EDED;

  --ink:#0C1416;
  --ink-2:#33454A;
  --ink-3:#5E7276;
  --ink-inv:#F2F7F7;

  /* brand */
  --teal:#0B7A85;
  --teal-deep:#075A63;
  --teal-wash:#DFEEEF;
  --teal-line:#B9D9DC;

  /* semantic state — reserved, never used as a series colour */
  --crit:#B4402A;
  --crit-wash:#FAE7E2;
  --warn:#8C6416;
  --warn-wash:#F8F0DC;
  --good:#2E6A50;
  --good-wash:#E2EFE8;

  /* chart identity hues (validated: light) */
  --c-us:#0091A0;
  --c-threat:#C1502E;
  --c-value:#3F6FB5;
  --c-major:#7C8B90;
  --c-other:#AEB9BC;
  --grid:#DCE5E5;

  /* inverted surfaces and chat bubbles need their own pairs, so they
     stay legible when every other token flips */
  --invert-bg:#0C1416;
  --invert-fg:#F2F7F7;
  --invert-muted:#93A6AA;
  --me-bg:#0B7A85;
  --me-fg:#FFFFFF;

  --shadow:0 1px 2px rgba(12,20,22,.05), 0 8px 24px -16px rgba(12,20,22,.28);
  --rail:232px;

  --f-disp:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B1113;
    --surface:#131C1F;
    --surface-2:#182326;
    --sunk:#0E1618;
    --line:#263438;
    --line-soft:#1D2A2D;

    --ink:#E8F0F0;
    --ink-2:#B4C4C6;
    --ink-3:#84999D;
    --ink-inv:#0B1113;

    --teal:#3AA5AF;
    --teal-deep:#7FD0D6;
    --teal-wash:#12292C;
    --teal-line:#245055;

    --crit:#E08268;
    --crit-wash:#2C1913;
    --warn:#D9AC5A;
    --warn-wash:#2A2211;
    --good:#6FB894;
    --good-wash:#12251C;

    --c-us:#2FA6AD;
    --c-threat:#D9694B;
    --c-value:#5E90DB;
    --c-major:#7E8E94;
    --c-other:#5A686C;
    --grid:#243133;

    --invert-bg:#08262A;
    --invert-fg:#EAF4F4;
    --invert-muted:#8FB0B4;
    --me-bg:#12545C;
    --me-fg:#EAF4F4;

    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1113;
  --surface:#131C1F;
  --surface-2:#182326;
  --sunk:#0E1618;
  --line:#263438;
  --line-soft:#1D2A2D;

  --ink:#E8F0F0;
  --ink-2:#B4C4C6;
  --ink-3:#84999D;
  --ink-inv:#0B1113;

  --teal:#3AA5AF;
  --teal-deep:#7FD0D6;
  --teal-wash:#12292C;
  --teal-line:#245055;

  --crit:#E08268;
  --crit-wash:#2C1913;
  --warn:#D9AC5A;
  --warn-wash:#2A2211;
  --good:#6FB894;
  --good-wash:#12251C;

  --c-us:#2FA6AD;
  --c-threat:#D9694B;
  --c-value:#5E90DB;
  --c-major:#7E8E94;
  --c-other:#5A686C;
  --grid:#243133;

  --invert-bg:#08262A;
  --invert-fg:#EAF4F4;
  --invert-muted:#8FB0B4;
  --me-bg:#12545C;
  --me-fg:#EAF4F4;

  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--f-disp); font-weight:600; letter-spacing:-.015em; text-wrap:balance; margin:0}
p{margin:0}
button{font-family:inherit; font-size:inherit; color:inherit}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px; border-radius:4px}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex; min-height:100vh; flex-direction:column}

.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:10px 16px; background:var(--surface);
  border-bottom:1px solid var(--line);
}
.wordmark{font-family:var(--f-disp); font-weight:700; font-size:16px; letter-spacing:-.02em}
.wordmark span{color:var(--teal)}
.topbar .spacer{flex:1}

.pill{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:500; padding:4px 9px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
  white-space:nowrap; cursor:pointer;
}
.pill.live{border-color:var(--teal-line); background:var(--teal-wash); color:var(--teal-deep)}
.pill.solo{border-color:var(--line); background:var(--sunk); color:var(--ink-3)}
.pill .led{width:6px; height:6px; border-radius:999px; background:currentColor; flex-shrink:0}

.viewport{flex:1; min-width:0; padding:18px 16px 96px; max-width:900px; width:100%}

.idbar{display:flex; gap:9px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px;
  padding:14px; background:var(--surface); border:1px solid var(--teal-line); border-radius:12px}
.idbar > div{flex:1; min-width:170px}
.idbar p{flex-basis:100%; font-size:11.5px; color:var(--ink-3)}

/* ---------- bottom nav (phone) ---------- */
.nav{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--surface); border-top:1px solid var(--line);
}
.nav::-webkit-scrollbar{display:none}
.navbtn{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:3px;
  min-width:62px; padding:7px 8px 5px; border:none; background:none; cursor:pointer;
  border-radius:9px; color:var(--ink-3); font-size:10.5px; font-weight:500; line-height:1;
}
.navbtn svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.navbtn[aria-current="page"]{color:var(--teal); background:var(--teal-wash)}

/* On a phone the rail wrapper is transparent to layout: the bar stays sticky
   at the top and the nav stays fixed at the bottom, in thumb reach. */
.rail{display:contents}
.railfoot{display:none}

@media (min-width:900px){
  .app{flex-direction:row}
  .rail{
    display:flex; flex-direction:column; gap:6px;
    position:fixed; top:0; bottom:0; left:0; width:var(--rail);
    padding:20px 12px; background:var(--surface);
    border-right:1px solid var(--line); overflow-y:auto;
  }
  .topbar{
    position:static; flex-direction:column; align-items:stretch; gap:7px;
    padding:0 0 10px; background:none; border-bottom:none;
  }
  .topbar .wordmark{padding:0 8px; font-size:17px}
  .topbar .spacer{display:none}
  .rail .pill{align-self:flex-start}
  .nav{
    position:static; flex-direction:column; gap:1px; overflow:visible;
    padding:0; background:none; border-top:none;
  }
  .navbtn{
    flex-direction:row; justify-content:flex-start; gap:10px; width:100%;
    min-width:0; padding:8px 10px; font-size:13.5px; text-align:left;
  }
  .railfoot{
    display:block; margin-top:auto; padding:14px 8px 0;
    border-top:1px solid var(--line-soft);
    font-size:10.5px; line-height:1.5; color:var(--ink-3);
  }
  .viewport{margin-left:var(--rail); padding:26px 32px 60px}
}

/* ---------- page furniture ---------- */
.page-head{margin-bottom:18px}
.eyebrow{
  font-family:var(--f-mono); font-size:10.5px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; color:var(--teal);
}
.page-head h1{font-size:clamp(21px,5vw,27px); margin:5px 0 6px}
.page-head p{font-size:13.5px; color:var(--ink-3); max-width:62ch}

.stack{display:flex; flex-direction:column; gap:14px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px}
.panel.flat{background:none; border:none; padding:0}
.panel-head{display:flex; align-items:baseline; gap:10px; margin-bottom:12px}
.panel-head h2{font-size:15px}
.panel-head .hint{font-size:11.5px; color:var(--ink-3); margin-left:auto; text-align:right}
.label{
  font-family:var(--f-mono); font-size:10px; font-weight:500; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3);
}

/* figures — big numbers only where the number is the point */
.figs{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.fig{background:var(--surface); padding:14px 15px}
.fig .v{font-family:var(--f-disp); font-size:23px; font-weight:600; letter-spacing:-.02em; line-height:1.1}
.fig .k{font-size:12px; color:var(--ink-2); margin-top:5px; line-height:1.35}
.fig .s{font-size:10.5px; color:var(--ink-3); margin-top:3px}
.fig.accent .v{color:var(--teal)}
.fig.threat .v{color:var(--crit)}

.chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:500;
  padding:3px 8px; border-radius:6px; background:var(--sunk); color:var(--ink-2);
}
.chip.us{background:var(--teal-wash); color:var(--teal-deep)}
.chip.threat{background:var(--crit-wash); color:var(--crit)}
.chip.warn{background:var(--warn-wash); color:var(--warn)}
.chip.good{background:var(--good-wash); color:var(--good)}
.chiprow{display:flex; flex-wrap:wrap; gap:6px}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:10px 14px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:500;
  cursor:pointer; transition:border-color .15s, background .15s;
}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.primary{background:var(--teal); border-color:var(--teal); color:#fff}
.btn.primary:hover:not(:disabled){background:var(--teal-deep); border-color:var(--teal-deep)}
.btn.quiet{border:none; background:none; color:var(--ink-3); padding:6px}
.btn.quiet:hover{color:var(--crit)}
.btn.sm{padding:6px 10px; font-size:12.5px}
.btn svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round}

label.fld{display:block; font-size:11px; font-weight:600; color:var(--ink-2); margin-bottom:4px}
input,select,textarea{
  width:100%; font-family:inherit; font-size:14px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 10px;
}
textarea{resize:vertical; min-height:64px}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--teal);
  box-shadow:0 0 0 3px var(--teal-wash)}
.formgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:11px}

.notice{
  display:flex; gap:10px; padding:12px 14px; border-radius:10px; font-size:12.5px;
  line-height:1.5; background:var(--warn-wash); color:var(--warn);
  border:1px solid color-mix(in srgb, var(--warn) 22%, transparent);
}
.notice.info{background:var(--teal-wash); color:var(--teal-deep);
  border-color:var(--teal-line)}
.notice.bad{background:var(--crit-wash); color:var(--crit);
  border-color:color-mix(in srgb, var(--crit) 25%, transparent)}
.notice svg{width:16px; height:16px; flex-shrink:0; margin-top:2px;
  stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round}
.notice strong{font-weight:600}

.scroller{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:13px}
th{
  font-family:var(--f-mono); font-size:9.5px; font-weight:500; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); text-align:left;
  padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
}
td{padding:10px; border-bottom:1px solid var(--line-soft); vertical-align:top}
tbody tr:last-child td{border-bottom:none}
.mutedcell{color:var(--ink-3); font-size:11.5px}

.empty{padding:26px 16px; text-align:center; color:var(--ink-3); font-size:13px}

/* ---------- rival battlecards ---------- */
.rival{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.rival.lead{border-color:color-mix(in srgb, var(--crit) 40%, var(--line))}
.rival > button{
  display:flex; gap:12px; width:100%; text-align:left; padding:14px 15px;
  background:none; border:none; cursor:pointer; align-items:flex-start;
}
.rival .stripe{width:3px; border-radius:999px; align-self:stretch; flex-shrink:0}
.rival .rname{font-family:var(--f-disp); font-weight:600; font-size:15px; letter-spacing:-.015em}
.rival .hq{font-size:11.5px; color:var(--ink-3)}
.rival .oneline{font-size:13px; color:var(--ink-2); margin-top:7px}
.rival .caret{margin-left:auto; flex-shrink:0; color:var(--ink-3); transition:transform .2s}
.rival .caret svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round}
.rival[data-open="true"] .caret{transform:rotate(180deg)}
.rival-body{padding:0 15px 16px; border-top:1px solid var(--line-soft); margin-top:2px}
.rival-body > * + *{margin-top:14px}
.swot{display:grid; gap:11px}
@media (min-width:640px){.swot{grid-template-columns:1fr 1fr}}
.swot > div{border-radius:9px; padding:11px 12px}
.swot .s{background:var(--good-wash)}
.swot .w{background:var(--crit-wash)}
.swot h4{font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px}
.swot .s h4{color:var(--good)}
.swot .w h4{color:var(--crit)}
ul.tight{margin:0; padding-left:16px; font-size:12.5px; color:var(--ink-2)}
ul.tight li + li{margin-top:4px}

/* ---------- plays ---------- */
.play{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.play > header{display:flex; align-items:center; gap:10px; padding:13px 15px;
  border-bottom:1px solid var(--line-soft)}
.play > header .dot{width:8px; height:8px; border-radius:999px; flex-shrink:0}
.play h3{font-size:14px}
.play .move{display:flex; gap:11px; padding:11px 15px; font-size:13.5px; color:var(--ink-2);
  line-height:1.5}
.play .move + .move{border-top:1px solid var(--line-soft)}
.play .move .n{font-family:var(--f-mono); font-size:11px; color:var(--teal); flex-shrink:0;
  padding-top:2px; width:16px}

/* ---------- chat ---------- */
.chat{display:flex; flex-direction:column; gap:12px}
.transcript{display:flex; flex-direction:column; gap:12px; min-height:120px}
.msg{max-width:min(92%,64ch); padding:11px 13px; border-radius:12px; font-size:14px;
  line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere}
.msg.me{align-self:flex-end; background:var(--me-bg); color:var(--me-fg); border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start; background:var(--surface); border:1px solid var(--line);
  border-bottom-left-radius:4px}
.msg.bot.thinking{color:var(--ink-3); font-style:italic}
.msg.sys{align-self:center; max-width:100%; background:var(--teal-wash); color:var(--teal-deep);
  font-size:12px; padding:7px 11px; border-radius:999px; font-family:var(--f-mono);
  white-space:normal; text-align:center}
#activity{display:flex; flex-direction:column; gap:12px}
#activity:empty{display:none}
.msg.err{align-self:flex-start; background:var(--crit-wash); color:var(--crit); font-size:13px}
.composer{display:flex; gap:8px; align-items:flex-end}
.composer textarea{min-height:46px; max-height:150px; font-size:15px}
.suggests{display:flex; flex-wrap:wrap; gap:6px}
.suggests button{
  padding:7px 11px; border-radius:999px; border:1px solid var(--teal-line);
  background:var(--teal-wash); color:var(--teal-deep); font-size:12.5px; cursor:pointer;
}
.suggests button:hover{background:var(--surface)}

/* ---------- charts ---------- */
.chartwrap{position:relative}
svg.chart{display:block; width:100%; height:auto; overflow:visible}
svg.chart text{font-family:var(--f-body); fill:var(--ink-3)}
svg.chart text.val{font-family:var(--f-mono); fill:var(--ink-2)}
svg.chart text.name{fill:var(--ink); font-weight:500}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:11.5px;
  color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:9px; height:9px; border-radius:2px; flex-shrink:0}
.keylist{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:2px 14px;
  margin-top:12px; font-size:12px; color:var(--ink-2)}
.keylist div{display:flex; gap:7px; align-items:baseline}
.keylist .kn{font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); width:13px;
  flex-shrink:0; text-align:right}
.tip{
  position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-115%);
  background:var(--ink); color:var(--ink-inv); font-size:11.5px; padding:6px 9px;
  border-radius:7px; white-space:nowrap; transition:opacity .12s; z-index:5;
  box-shadow:var(--shadow);
}
.tip .num{color:inherit; opacity:.85}

.feeditem{display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line-soft)}
.feeditem:last-child{border-bottom:none}
.feeditem .badge{flex-shrink:0; width:26px; height:26px; border-radius:7px;
  display:flex; align-items:center; justify-content:center; font-family:var(--f-mono);
  font-size:10px; font-weight:500}
.feeditem .body{flex:1; min-width:0}
.feeditem .body p{font-size:13px; color:var(--ink-2); line-height:1.45}
.feeditem .meta{font-size:10.5px; color:var(--ink-3); margin-top:3px; font-family:var(--f-mono)}
.feeditem .t{font-size:13px; font-weight:600}

@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

<div class="app">
  <div class="rail">
    <header class="topbar">
      <div class="wordmark">botiss <span>CI Desk</span></div>
      <div class="spacer"></div>
      <button class="pill" id="repPill" title="Set the name attached to intel you log">…</button>
      <button class="pill" id="modePill" title="Where logged intel is stored">…</button>
    </header>

    <nav class="nav" id="nav" aria-label="Sections"></nav>

    <div class="railfoot">
      Figures researched Jun 2026 · iData, Mordor, Straumann AR2025. Share splits are estimates.
      Prices are quote-based. Briefing aid, not clinical or regulatory advice.
    </div>
  </div>

  <main class="viewport" id="view"></main>
</div>

<script>
"use strict";

/* =====================================================================
   1. KNOWLEDGE BASE — the static briefing layer.
   One source of truth: the UI renders it and the agent is briefed from it,
   so the two can never drift apart.
   ===================================================================== */

const KB = {
  asOf: "June 2026",

  figures: [
    { v:"$2.33B", k:"Global bone graft + biomaterials, 2025", s:"iData Research" },
    { v:"≈$3.8B", k:"Projected market, 2032", s:"~7.2% CAGR", tone:"accent" },
    { v:"~CHF 1.3B", k:"Regenerative market, Straumann's own view", s:"revised up from CHF 0.7B" },
    { v:"~50%", k:"Implant cases needing graft or membrane", s:"the attach rate to chase" }
  ],

  /* x = relative price premium (1 low → 10 high), y = portfolio breadth,
     w = rough share weight (bubble area) */
  position: [

/* =====================================================================
   2. SHARED STORE — team intel that outlives the page.
   Shared mode uses the artifact's realtime store; if that isn't available
   in this view the app keeps working against this device's local storage.
   ===================================================================== */

const COLLECTIONS = ["prices", "notes", "learned"];
const LOCAL_PREFIX = "botiss_ci_";

const Store = {
  mode: "local",
  db: null,
  data: { prices:[], notes:[], learned:[] },
  problem: null,
  _subs: [],

  onChange(fn){ this._subs.push(fn); },
  _emit(){ for (const fn of this._subs) { try { fn(); } catch (e) { console.error(e); } } },

  async connect(){
    try {
      const db = await window.claude?.use?.("db");
      if (db) { this.db = db; this.mode = "shared"; this._subscribe(); this._emit(); return; }
    } catch (e) { console.error(e); }
    this._loadLocal();
    this._emit();
  },

  _subscribe(){
    for (const c of COLLECTIONS) {
      try {
        this.db.collection(c).orderBy("ts", "desc").limit(200).onSnapshot(
          snap => {
            this.data[c] = snap.docs.map(d => ({ id:d.id, ...d.data() }));
            this._emit();
          },
          err => {
            this.problem = err.code === "revoked"
              ? "Shared access ended for this session — reload to reconnect."
              : "Live sync interrupted (" + err.code + "). Reload to retry.";
            this._emit();
          }
        );
      } catch (e) { console.error(e); }
    }
  },

  _loadLocal(){
    for (const c of COLLECTIONS) {
      try {
        const raw = localStorage.getItem(LOCAL_PREFIX + c);
        this.data[c] = raw ? JSON.parse(raw) : [];
      } catch { this.data[c] = []; }
    }
  },
  _saveLocal(c){
    try { localStorage.setItem(LOCAL_PREFIX + c, JSON.stringify(this.data[c])); }
    catch (e) { console.error(e); }
  },

  async add(coll, body){
    const row = { ...body, ts: Date.now(), rep: Rep.get() || "unattributed" };
    if (this.mode === "shared") {
      try {
        await this.db.collection(coll).add(row);
        return { ok:true };
      } catch (e) {
        return { ok:false, why: e.code === "quota_exceeded"
          ? "The shared store is full. Delete some old rows first."
          : "Could not save to the shared store (" + (e.code || "unknown") + ")." };
      }
    }
    this.data[coll] = [{ id: mintId(), ...row }, ...this.data[coll]];
    this._saveLocal(coll); this._emit();
    return { ok:true };
  },

  async remove(coll, id){
    if (this.mode === "shared") {
      try { await this.db.doc(coll + "/" + id).delete(); return { ok:true }; }
      catch (e) { return { ok:false, why:"Could not delete (" + (e.code || "unknown") + ")." }; }
    }
    this.data[coll] = this.data[coll].filter(r => r.id !== id);
    this._saveLocal(coll); this._emit();
    return { ok:true };
  }
};

function mintId(){
  try { if (crypto?.randomUUID) return crypto.randomUUID(); } catch {}
  return "r" + Date.now() + Math.random().toString(36).slice(2, 8);
}

/* Who is logging. No viewer-identity capability is available to this page,
   so the name is self-declared per device and is not verified.
   Edited inline rather than through prompt(), which sandboxed frames block. */
const Rep = {
  open:false,
  get(){ try { return localStorage.getItem(LOCAL_PREFIX + "rep") || ""; } catch { return ""; } },
  set(v){ try { localStorage.setItem(LOCAL_PREFIX + "rep", v); } catch {} },
  ask(){
    this.open = true;
    render();
    setTimeout(() => document.getElementById("repInput")?.focus(), 30);
    return false;
  },
  save(){
    const v = document.getElementById("repInput")?.value.trim() || "";
    if (v) this.set(v);
    this.open = false;
    paintPills();
    render();
  },
  bar(){
    if (!this.open) return "";
    return '<div class="idbar">' +
      '<div><label class="fld" for="repInput">Your name</label>' +
        '<input id="repInput" value="' + esc(this.get()) + '" placeholder="e.g. Branko T." ' +
        'autocomplete="name"></div>' +
      '<button class="btn primary" id="repSave">Save</button>' +
      '<p>Attached to everything you log so colleagues know where intel came from. ' +
      'Self-declared and stored on this device — this app has no verified sign-in.</p>' +
    '</div>';
  }
};

const svg = (name, cls) =>
  '<svg viewBox="0 0 24 24" aria-hidden="true"' + (cls ? ' class="' + cls + '"' : '') + '>' + ICON[name] + '</svg>';

const timeAgo = ts => {
  if (!ts) return "";
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  const d = Math.floor(h / 24);
  if (d < 30) return d + "d ago";
  return new Date(ts).toISOString().slice(0, 10);
};

function positioningChart(){
  const W = 640, H = 400, pad = { t:22, r:26, b:46, l:52 };
  const xs = v => pad.l + (v - 1) / 9 * (W - pad.l - pad.r);
  const ys = v => H - pad.b - (v - 3.5) / 6.5 * (H - pad.t - pad.b);
  /* area-true square-root scale, mapped to a radius range you can actually read */
  const roots = KB.position.map(p => Math.sqrt(p.w));
  const lo = Math.min(...roots), hi = Math.max(...roots);
  const r = w => 9 + (Math.sqrt(w) - lo) / (hi - lo) * 12;

  let grid = "";
  for (let v = 2; v <= 10; v += 2) {
    grid += '<line x1="' + xs(v).toFixed(1) + '" y1="' + pad.t + '" x2="' + xs(v).toFixed(1) +
            '" y2="' + (H - pad.b) + '" stroke="var(--grid)" stroke-width="1"/>' +
            '<text x="' + xs(v).toFixed(1) + '" y="' + (H - pad.b + 18) +
            '" text-anchor="middle" font-size="11" class="val">' + v + '</text>';
  }
  for (let v = 4; v <= 10; v += 2) {
    grid += '<line x1="' + pad.l + '" y1="' + ys(v).toFixed(1) + '" x2="' + (W - pad.r) +
            '" y2="' + ys(v).toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/>' +
            '<text x="' + (pad.l - 10) + '" y="' + (ys(v) + 4).toFixed(1) +
            '" text-anchor="end" font-size="11" class="val">' + v + '</text>';
  }

  let marks = "";
  KB.position.forEach((p, i) => {
    const cx = xs(p.x), cy = ys(p.y), rad = r(p.w);
    const fill = KIND_COLOR[p.kind];
    marks +=
      '<g class="pt" data-i="' + i + '" tabindex="0" role="img" aria-label="' +
        esc(p.n + ': price premium ' + p.x + ' of 10, portfolio breadth ' + p.y + ' of 10') + '">' +
        '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + rad.toFixed(1) +
          '" fill="var(--surface)" stroke="var(--surface)" stroke-width="4"/>' +
        '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + rad.toFixed(1) +
          '" fill="' + fill + '" fill-opacity="0.2" stroke="' + fill + '" stroke-width="2"/>' +
        '<text x="' + cx.toFixed(1) + '" y="' + (cy + 3.8).toFixed(1) +
          '" text-anchor="middle" font-size="11" class="val">' + (i + 1) + '</text>' +
      '</g>';
  });

  /* Direct labels only for the two that carry the story; the rest are keyed
     below, which keeps a phone-width chart free of collisions. */
  [0, 1].forEach(i => {
    const p = KB.position[i], cx = xs(p.x), cy = ys(p.y), rad = r(p.w);
    const anchor = i === 1 ? "end" : "middle";
    const lx = i === 1 ? cx + 4 : cx;
    marks += '<text x="' + lx.toFixed(1) + '" y="' + (cy - rad - 9).toFixed(1) +
             '" text-anchor="' + anchor + '" font-size="12" class="name">' + esc(p.n) + '</text>';
  });

  const key = KB.position.map((p, i) =>
    '<div><span class="kn">' + (i + 1) + '</span><span>' + esc(p.n) + '</span></div>').join("");

  return '' +
  '<div class="panel">' +
    '<div class="panel-head"><h2>Where everyone sits</h2>' +
      '<span class="hint">bubble = rough share weight</span></div>' +
    '<div class="chartwrap" id="posWrap">' +
      '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="Price premium against portfolio breadth">' +
        grid +
        '<line x1="' + pad.l + '" y1="' + (H - pad.b) + '" x2="' + (W - pad.r) + '" y2="' + (H - pad.b) +
          '" stroke="var(--line)" stroke-width="1.5"/>' +
        '<line x1="' + pad.l + '" y1="' + pad.t + '" x2="' + pad.l + '" y2="' + (H - pad.b) +
          '" stroke="var(--line)" stroke-width="1.5"/>' +
        marks +
        '<text x="' + ((W + pad.l - pad.r) / 2) + '" y="' + (H - 6) +
          '" text-anchor="middle" font-size="11.5">Relative price premium →</text>' +
        '<text x="14" y="' + ((H + pad.t - pad.b) / 2) + '" text-anchor="middle" font-size="11.5" ' +
          'transform="rotate(-90 14 ' + ((H + pad.t - pad.b) / 2) + ')">Portfolio breadth →</text>' +
      '</svg>' +
      '<div class="tip" id="posTip"></div>' +
    '</div>' +
    legendRow([["us","botiss"],["threat","Geistlich"],["major","other majors"],["value","value tier"]]) +
    '<div class="keylist">' + key + '</div>' +
  '</div>';
}

function shareChart(){
  const rows = KB.share;
  const max = 30, W = 640, rowH = 30, labelW = 152, barMax = W - labelW - 54;
  const H = rows.length * rowH + 8;
  /* square at the baseline, rounded at the data end — a bar is not a pill */
  const barPath = (x, y, w, h, rad) => {
    const rr = Math.min(rad, w, h / 2);
    return "M" + x + "," + y + "H" + (x + w - rr) +
           "a" + rr + "," + rr + " 0 0 1 " + rr + "," + rr +
           "V" + (y + h - rr) +
           "a" + rr + "," + rr + " 0 0 1 " + (-rr) + "," + rr +
           "H" + x + "Z";
  };

  let bars = "";
  rows.forEach((r, i) => {
    const y = i * rowH + 4;
    const w = Math.max(3, r.v / max * barMax);
    const fill = KIND_COLOR[r.kind];
    bars +=
      '<text x="' + (labelW - 12) + '" y="' + (y + 15) + '" text-anchor="end" font-size="12">' + esc(r.n) + '</text>' +
      '<path d="' + barPath(labelW, y + 4, +w.toFixed(1), rowH - 12, 4) + '" fill="' + fill + '">' +
        '<title>' + esc(r.n + ": about " + r.v + "% (estimate)") + '</title></path>' +
      '<text x="' + (labelW + w + 8).toFixed(1) + '" y="' + (y + 15) +
        '" font-size="11.5" class="val">' + r.v + '%</text>';
  });
  return '' +
  '<div class="panel">' +
    '<div class="panel-head"><h2>Share of the graft market</h2>' +
      '<span class="hint">synthesised estimates — brief with them, don\'t quote them</span></div>' +
    '<div class="scroller">' +
      '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" style="min-width:520px" role="img" ' +
        'aria-label="Estimated share of the global dental bone graft market by supplier">' + bars + '</svg>' +
    '</div>' +
    legendRow([["us","botiss"],["threat","Geistlich"],["major","other majors"],["value","value tier"],["other","others / regional"]]) +
  '</div>';
}

function legendRow(pairs){
  return '<div class="legend">' + pairs.map(([k, label]) =>
    '<span><i style="background:' + KIND_COLOR[k] + '"></i>' + esc(label) + '</span>').join("") + '</div>';
}

function wirePositioningTip(){
  const wrap = document.getElementById("posWrap");
  const tip = document.getElementById("posTip");
  if (!wrap || !tip) return;
  const show = el => {
    const i = +el.dataset.i, p = KB.position[i];
    const c = el.querySelector("circle"), box = wrap.getBoundingClientRect();
    const r = c.getBoundingClientRect();
    tip.innerHTML = '<strong>' + esc(p.n) + '</strong><br><span class="num">premium ' + p.x +
                    ' · breadth ' + p.y + '</span>';
    tip.style.left = (r.left + r.width / 2 - box.left) + "px";
    tip.style.top = (r.top - box.top) + "px";
    tip.style.opacity = "1";
  };
  const hide = () => { tip.style.opacity = "0"; };
  wrap.querySelectorAll(".pt").forEach(el => {
    el.addEventListener("pointerenter", () => show(el));
    el.addEventListener("pointerleave", hide);
    el.addEventListener("focus", () => show(el));
    el.addEventListener("blur", hide);
  });
}

/* ----- Deal calculator ----- */
const deal = { implants:60, now:40, target:60, rev:180 };

function dealNumbers(){
  const num = v => { const f = parseFloat(v); return Number.isNaN(f) ? 0 : f; };
  const casesNow = num(deal.implants) * num(deal.now) / 100;
  const casesTgt = num(deal.implants) * num(deal.target) / 100;
  const inc = Math.max(0, casesTgt - casesNow);
  const monthly = inc * num(deal.rev);
  return { casesNow, casesTgt, inc, monthly, yearly:monthly * 12 };
}
const fmtInt = x => x.toLocaleString(undefined, { maximumFractionDigits:0 });

/* Patches the figures in place, so typing never rebuilds the inputs
   under the caret. */
function paintDeal(){
  const d = dealNumbers();
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set("dl_year", fmtInt(d.yearly));
  set("dl_month", fmtInt(d.monthly));
  set("dl_extra", "+" + d.inc.toFixed(1));
  set("dl_now", d.casesNow.toFixed(0));
  set("dl_tgt", d.casesTgt.toFixed(0));
}

const SUGGESTIONS = [
  "How do I answer “we always use Bio-Oss”?",
  "Cheapest credible answer to a Korean bundle?",
  "Which product for a patient refusing animal-derived graft?",
  "Brief me on Geistlich before a meeting",
  "Where does maxgraft beat everything else?",
  "What should I say about NOVAMag SHIELD?"
];

const Agent = {
  fn:null, ready:false, tools:false, checked:false, done:false,
  turns:[],       /* real conversation turns — what gets sent back as context */
  activity:[],    /* what the tools did: shown to the rep, never fed to Claude */
  streamed:"", lastError:null,
  running:false, ctl:null,

  async init(){
    if (this.checked) return;
    this.checked = true;
    try {
      this.fn = await window.claude?.use?.("sample");
      if (this.fn) {
        this.ready = true;
        const lim = await this.fn.limits().catch(() => null);
        this.tools = !!lim?.tools;
      }
    } catch (e) { console.error(e); }
    this.done = true;
    if (tab === "ask") renderChat();
  },

  /* The standing instruction turn: rules, the static briefing, and the
     team's live intel. Rebuilt on every send so new intel lands at once. */
  briefing(){
    const rivals = KB.rivals.map(r =>
      "• " + r.name + " (" + r.tier + ", " + r.hq + "). " + r.line +
      "\n  Products: " + r.products.join("; ") +
      "\n  Recent: " + r.moves.join("; ") +
      "\n  Strong: " + r.strengths.join("; ") +
      "\n  Vulnerable: " + r.weaknesses.join("; ")).join("\n");

    const products = KB.products.map(p =>
      "• " + p.cat + " — ours: " + p.ours + ". " + p.why + " Rivals: " + p.rivals).join("\n");

    const plays = KB.plays.map(p => "• " + p.head + "\n  - " + p.moves.join("\n  - ")).join("\n");
    const markets = KB.markets.map(m => "• " + m.region + " (" + m.tone + "). " + m.notes).join("\n");
    const anchors = KB.anchors.map(a =>
      "• " + a.product + " / " + a.brand + " / " + a.country + " / " + a.pack + ": " + a.price + " (" + a.source + ")").join("\n");
    const figures = KB.figures.map(f => "• " + f.v + " — " + f.k + " (" + f.s + ")").join("\n");

    const teamPrices = Store.data.prices.slice(0, 40).map(r =>
      "• " + [r.product, r.brand, r.country, r.pack].filter(Boolean).join(" / ") +
      ": " + (r.price || "?") + " " + (r.currency || "") +
      " [" + (r.source || "no source") + ", " + (r.rep || "unattributed") + ", " +
      new Date(r.ts || Date.now()).toISOString().slice(0, 10) + "]").join("\n") || "(none logged yet)";

    const teamLearned = Store.data.learned.slice(0, 40).map(r =>
      "• " + (r.title || "untitled") + ": " + (r.body || "") +
      " [" + (r.rep || "unattributed") + ", " + new Date(r.ts || Date.now()).toISOString().slice(0, 10) + "]").join("\n") || "(none yet)";

    const teamNotes = Store.data.notes.slice(0, 30).map(r =>
      "• " + (r.topic || "note") + (r.competitor ? " (" + r.competitor + ")" : "") + ": " + (r.body || "") +
      " [" + (r.rep || "unattributed") + "]").join("\n") || "(none yet)";

    return [
"You are the botiss CI Desk agent, a competitive-intelligence assistant for the botiss / Straumann dental regenerative-biomaterials sales team. The person asking is a botiss sales rep or manager, often on a phone between appointments.",
"",
"HOW TO ANSWER",
"- Lead with the answer in one or two sentences, then at most five short bullets of substance. No preamble, no restating the question.",
"- Ground every claim in the BRIEFING and TEAM INTEL below. If it is not there, say plainly that you do not know it and say what would settle it.",
"- Never invent clinical evidence, study results, publication counts, regulatory clearances or prices. Those are the claims that get a rep into trouble.",
"- Prices in this market are quote-based. Never present a figure as an official or list price; say whose quote it was and when.",
"- Distinguish what is solid (portfolio facts, published launches) from what is an estimate (share splits, positioning scores).",
"- No clinical, regulatory, legal or financial advice. If a claim would go to a clinician, say what needs verifying first.",
"- Write in plain British English. Never use em dashes.",
"",
"WORKING WITH THE TEAM'S STORE",
"- When the rep tells you something new from the field (a competitor price, an objection, a win or loss, a product sighting), save it: log_price_point for a price, log_field_note for an episode, save_learning for a durable fact worth keeping. Say in one line what you saved.",
"- Ask before saving only if what they said is ambiguous. Do not save your own reasoning or general knowledge, only what the rep reports.",
"- Use search_price_intel before answering any price question, and attach_rate_math for any revenue or attach-rate question rather than doing the arithmetic in your head.",
"",
"KEY FIGURES (researched " + KB.asOf + ")",
figures,
"",
"BOTISS PORTFOLIO AGAINST RIVALS",
products,
"",
"RIVALS",
rivals,
"",
"PLAYS THAT WORK",
plays,
"",
"MARKETS",
markets,
"",
"INDICATIVE PRICE ANCHORS (grey-market orientation, not official)",
anchors,
"",
"TEAM INTEL — VERIFIED PRICES (logged by the team, this is the trusted layer)",
teamPrices,
"",
"TEAM INTEL — DURABLE LEARNINGS",
teamLearned,
"",
"TEAM INTEL — FIELD NOTES",
teamNotes,
"",
"The rep's question follows."
    ].join("\n");
  },

  toolset(){
    const note = msg => addSysLine(msg);
    return [
      {
        name:"search_price_intel",
        description:"Search the team's verified price entries and the indicative reference anchors. Returns matching rows with source, who logged them and when. Use before answering anything about price.",
        inputSchema:{ type:"object", properties:{ query:{ type:"string", description:"product, brand, country or category" } }, required:["query"] },
        execute(input){
          const q = String(input.query || "").toLowerCase();
          const hit = r => JSON.stringify(r).toLowerCase().includes(q);
          const verified = Store.data.prices.filter(hit).slice(0, 12).map(r => ({
            product:r.product, brand:r.brand, country:r.country, pack:r.pack,
            price:r.price, currency:r.currency, source:r.source, rep:r.rep,
            date:new Date(r.ts || Date.now()).toISOString().slice(0, 10), trust:"team-verified"
          }));
          const anchors = KB.anchors.filter(hit).slice(0, 8).map(a => ({ ...a, trust:"indicative-only" }));
          note("searched price intel for “" + (input.query || "") + "”");
          return { verified, anchors, verified_count:verified.length };
        }
      },
      {
        name:"log_price_point",
        description:"Save a price the rep reports from the field to the team's shared store. Only call this for a figure the rep actually gives you, never an estimate of your own.",
        inputSchema:{ type:"object", properties:{
          product:{ type:"string" }, brand:{ type:"string" }, country:{ type:"string" },
          pack:{ type:"string" }, price:{ type:"string" },
          currency:{ type:"string", description:"EUR, USD, GBP, CHF, BRL, JPY, KRW or AED" },
          category:{ type:"string" }, source:{ type:"string", description:"whose quote or tender this was" }
        }, required:["product","price"] },
        async execute(input){
          const res = await Store.add("prices", {
            product:String(input.product || "").slice(0, 140),
            brand:String(input.brand || "").slice(0, 90),
            country:String(input.country || "").slice(0, 60),
            pack:String(input.pack || "").slice(0, 50),
            price:String(input.price || "").slice(0, 24),
            currency:String(input.currency || "EUR").slice(0, 6),
            category:String(input.category || "").slice(0, 40),
            source:String(input.source || "reported to the agent").slice(0, 180),
            via:"agent"
          });
          if (!res.ok) throw new Error(res.why);
          note("logged a price point: " + (input.product || "") + " " + (input.price || ""));
          return { saved:true, shared:Store.mode === "shared" };
        }
      },
      {
        name:"log_field_note",
        description:"Save something that happened in the field: an objection heard, a competitor sighting, a win or loss and its reason. Use for episodes tied to a place or account.",
        inputSchema:{ type:"object", properties:{
          topic:{ type:"string", description:"short headline" },
          body:{ type:"string", description:"the specifics: who, what product, what was said" },
          competitor:{ type:"string" }
        }, required:["topic","body"] },
        async execute(input){
          const res = await Store.add("notes", {
            topic:String(input.topic || "").slice(0, 140),
            body:String(input.body || "").slice(0, 1200),
            competitor:String(input.competitor || "").slice(0, 80),
            via:"agent"
          });
          if (!res.ok) throw new Error(res.why);
          note("saved a field note: " + (input.topic || ""));
          return { saved:true };
        }
      },
      {
        name:"save_learning",
        description:"Record a durable fact about the market that the whole team should have from now on, and that you were told rather than already knew. It is added to every future briefing.",
        inputSchema:{ type:"object", properties:{
          title:{ type:"string" }, body:{ type:"string" },
          tags:{ type:"array", items:{ type:"string" } }
        }, required:["title","body"] },
        async execute(input){
          const tags = Array.isArray(input.tags) ? input.tags.slice(0, 6).map(t => String(t).slice(0, 24)) : [];
          const res = await Store.add("learned", {
            title:String(input.title || "").slice(0, 140),
            body:String(input.body || "").slice(0, 1600),
            tags, via:"agent"
          });
          if (!res.ok) throw new Error(res.why);
          note("learned: " + (input.title || ""));
          return { saved:true };
        }
      },
      {
        name:"attach_rate_math",
        description:"Work out the incremental revenue from lifting an account's graft attach rate. Returns monthly and yearly figures and the case counts. Use this instead of doing arithmetic yourself.",
        inputSchema:{ type:"object", properties:{
          implants_per_month:{ type:"number" }, current_pct:{ type:"number" },
          target_pct:{ type:"number" }, revenue_per_case:{ type:"number" }
        }, required:["implants_per_month","current_pct","target_pct","revenue_per_case"] },
        execute(input){
          const n = v => { const f = Number(v); return Number.isFinite(f) ? f : 0; };
          const imp = n(input.implants_per_month), cur = n(input.current_pct);
          const tgt = n(input.target_pct), rev = n(input.revenue_per_case);
          const casesNow = imp * cur / 100, casesTgt = imp * tgt / 100;
          const extra = Math.max(0, casesTgt - casesNow);
          note("ran the attach-rate maths");
          return {
            grafted_cases_now:+casesNow.toFixed(1),
            grafted_cases_at_target:+casesTgt.toFixed(1),
            extra_cases_per_month:+extra.toFixed(1),
            incremental_per_month:Math.round(extra * rev),
            incremental_per_year:Math.round(extra * rev * 12),
            note:"currency is whatever the rep used for revenue_per_case"
          };
        }
      },
      {
        name:"competitor_profile",
        description:"Full stored profile for one competitor: products, recent moves, strengths and where botiss can push. Use when a question turns on one rival in detail.",
        inputSchema:{ type:"object", properties:{ name:{ type:"string" } }, required:["name"] },
        execute(input){
          const q = String(input.name || "").toLowerCase();
          const r = KB.rivals.find(x => x.name.toLowerCase().includes(q))
                 || KB.rivals.find(x => q.includes(x.name.toLowerCase().split(" ")[0]));
          if (!r) return { found:false, known:KB.rivals.map(x => x.name) };
          note("pulled the " + r.name + " profile");
          return r;
        }
      }
    ];
  },

  errorCopy(code){
    switch (code) {
      case "not_granted":
      case "sampling_disabled":
        return "Claude access was declined for this app, so the agent is off for this session. Every other tab still works.";
      case "rate_limited":
        return "Your Claude usage is rate limited right now. Give it a few minutes and ask again.";
      case "session_expired":
        return "Your Claude session expired. Sign in again, then reload this app.";
      case "prompt_too_large":
        return "This conversation grew too long. Start a fresh one with the Clear button.";
      case "refused":
        return "Claude declined to answer that one. Try asking it a different way.";
      case "empty_completion":
        return "No answer came back. Try a narrower question.";
      case "tools_unavailable":
        return "This view cannot run the agent's tools, so it answered from the briefing only.";
      case "cancelled":
        return "";
      default:
        return "That did not get through (" + code + "). Try again in a moment.";
    }
  },

  async send(text){
    const q = text.trim();
    if (!q || this.running || !this.ready) return;

    this.turns.push({ role:"user", content:q });
    /* Keep the conversation short so the briefing always fits inside the
       64 KiB input budget, and never start on an assistant turn. */
    while (this.turns.length > 10) this.turns.shift();
    while (this.turns.length && this.turns[0].role !== "user") this.turns.shift();

    this.activity = [];
    this.streamed = "";
    this.lastError = null;
    this.running = true;
    this.ctl = new AbortController();
    renderChat();

    const opts = {
      signal:this.ctl.signal,
      cache:false,
      onText:({ text }) => {
        this.streamed = text;
        const b = document.getElementById("streamBubble");
        if (b) { b.classList.remove("thinking"); b.textContent = text; scrollChat(); }
      }
    };
    if (this.tools) opts.tools = this.toolset();

    try {
      const { text:answer } = await this.fn(
        [{ role:"user", content:this.briefing() }, ...this.turns], opts);
      this.turns.push({ role:"assistant", content:answer });
    } catch (e) {
      if (e?.text) this.turns.push({ role:"assistant", content:e.text });
      this.lastError = this.errorCopy(e?.code || "upstream_error");
      if (e?.code === "not_granted" || e?.code === "sampling_disabled") this.ready = false;
    } finally {
      this.running = false;
      this.ctl = null;
      this.streamed = "";
      renderChat();
    }
  },

  stop(){ this.ctl?.abort(); },
  clear(){ this.turns = []; this.activity = []; this.lastError = null; renderChat(); }
};

/* Tool progress: appended in place so it never disturbs the streaming answer. */
function addSysLine(msg){
  Agent.activity.push(msg);
  const host = document.getElementById("activity");
  if (host) {
    host.innerHTML = Agent.activity.map(m => '<div class="msg sys">' + esc(m) + '</div>').join("");
    scrollChat();
  }
}

function viewAsk(){
  return head("Ask the desk", "Your competitive intelligence, on call",
    "Answers come from this briefing plus everything your team has logged. Tell it what you heard in the field and it saves that for everyone.") +
    '<div class="chat" id="chat"></div>';
}

function renderChat(){
  const host = document.getElementById("chat");
  if (!host) return;

  if (!Agent.done) {
    host.innerHTML = '<div class="panel"><div class="empty">Connecting to Claude…</div></div>';
    return;
  }
  if (!Agent.ready) {
    host.innerHTML =
      '<div class="notice bad">' + svg("info") +
        '<div><strong>The agent is not available in this view.</strong> ' +
        esc(Agent.lastError || "This app needs permission to use your Claude account. If you declined the prompt, reload and allow it; if you opened this page outside Claude, open it from your Claude artifacts instead.") +
        '</div></div>' +
      '<div class="notice info" style="margin-top:12px">' + svg("info") +
        '<div>Everything else works without it: battlecards, the product map, prices, markets and the deal maths.</div></div>';
    return;
  }

  const msgs = Agent.turns.map(t =>
    '<div class="msg ' + (t.role === "user" ? "me" : "bot") + '">' + esc(t.content) + '</div>').join("");

  const activity = '<div id="activity">' + Agent.activity.map(m =>
    '<div class="msg sys">' + esc(m) + '</div>').join("") + '</div>';

  const streaming = Agent.running
    ? '<div class="msg bot' + (Agent.streamed ? "" : " thinking") + '" id="streamBubble">' +
      esc(Agent.streamed || "Thinking…") + '</div>' : "";

  const err = Agent.lastError
    ? '<div class="msg err">' + esc(Agent.lastError) + '</div>' : "";

  const chips = Agent.turns.length ? "" :
    '<div class="suggests">' + SUGGESTIONS.map(s =>
      '<button data-ask="' + esc(s) + '">' + esc(s) + '</button>').join("") + '</div>';

  host.innerHTML =
    (Agent.turns.length || Agent.running ? "" :
      '<div class="notice info">' + svg("spark") +
        '<div><strong>Runs on your own Claude account.</strong> The first question asks your permission. ' +
        (Agent.tools
          ? "It can search the team's price intel and log new intel back for everyone."
          : "Tool use is unavailable in this view, so it will answer from the briefing without logging anything.") +
        '</div></div>') +
    '<div class="transcript" id="transcript">' + msgs + activity + streaming + err + '</div>' +
    chips +
    '<div class="composer">' +
      '<textarea id="askBox" rows="1" placeholder="What do you need to know?" ' +
        (Agent.running ? "disabled" : "") + '></textarea>' +
      (Agent.running
        ? '<button class="btn" id="askStop" title="Stop">' + svg("stop") + '</button>'
        : '<button class="btn primary" id="askSend" title="Send">' + svg("send") + '</button>') +
    '</div>' +
    (Agent.turns.length
      ? '<div style="display:flex;justify-content:flex-end"><button class="btn sm" id="askClear">Clear conversation</button></div>'
      : "");

  const box = document.getElementById("askBox");
  if (box && !Agent.running) {
    box.addEventListener("input", () => {
      box.style.height = "auto";
      box.style.height = Math.min(150, box.scrollHeight) + "px";
    });
    box.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitAsk(); }
    });
  }
  scrollChat();
}

function submitAsk(){
  const box = document.getElementById("askBox");
  if (!box) return;
  const v = box.value;
  box.value = "";
  Agent.send(v);
}

function scrollChat(){
  const t = document.getElementById("transcript");
  if (t) t.scrollIntoView({ block:"end", behavior:"smooth" });
}

/* =====================================================================
   7. RENDER + EVENTS
   ===================================================================== */

const VIEWS = {
  desk:viewDesk, ask:viewAsk, rivals:viewRivals, plays:viewPlays, products:viewProducts,
  prices:viewPrices, markets:viewMarkets, deal:viewDeal, learned:viewLearned, method:viewMethod
};

function paintNav(){
  document.getElementById("nav").innerHTML = NAV.map(n =>
    '<button class="navbtn" data-tab="' + n.id + '"' +
      (tab === n.id ? ' aria-current="page"' : "") + '>' +
      svg(n.icon) + '<span>' + n.label + '</span></button>').join("");
}

function paintPills(){
  const rep = document.getElementById("repPill");
  const name = Rep.get();
  rep.innerHTML = name ? esc(name) : "Set your name";
  rep.className = "pill" + (name ? "" : " solo");

  const mode = document.getElementById("modePill");
  if (Store.mode === "shared") {
    mode.innerHTML = '<span class="led"></span>Team';
    mode.className = "pill live";
    mode.title = "Logged intel is shared live with colleagues who can open this app";
  } else {
    mode.innerHTML = '<span class="led"></span>This device';
    mode.className = "pill solo";
    mode.title = "The shared store is unavailable here, so intel stays in this browser";
  }
}

function render(scrollTop){
  paintNav();
  const host = document.getElementById("view");
  host.innerHTML = (Store.problem
    ? '<div class="notice bad" style="margin-bottom:14px">' + svg("info") +
      '<div>' + esc(Store.problem) + '</div></div>'
    : "") + Rep.bar() + VIEWS[tab]();

  if (tab === "desk") wirePositioningTip();
  if (tab === "ask") { Agent.init(); renderChat(); }
  if (scrollTop) window.scrollTo({ top:0 });
}

/* A colleague's entry arriving must not yank the form out from under
   someone who is mid-sentence. */
function isTyping(){
  const el = document.activeElement;
  return !!el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
}

function flash(id, text, kind){
  const el = document.getElementById(id);
  if (!el) return;
  el.hidden = false;
  el.className = "notice " + (kind || "info");
  el.innerHTML = svg("info") + "<div>" + esc(text) + "</div>";
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-rival],[data-ask],[data-jump],[data-del],[data-del-price]," +
    "#p_add,#p_export,#n_add,#m_rep,#repPill,#repSave,#modePill,#askSend,#askStop,#askClear");
  if (!t) return;

  if (t.dataset.tab) { tab = t.dataset.tab; render(true); return; }
  if (t.id === "repSave") { Rep.save(); return; }

  if (t.dataset.rival) {
    const n = t.dataset.rival;
    openRivals.has(n) ? openRivals.delete(n) : openRivals.add(n);
    render(); return;
  }

  if (t.dataset.jump) { tab = "ask"; render(true); setTimeout(() => Agent.send(t.dataset.jump), 80); return; }
  if (t.dataset.ask) { Agent.send(t.dataset.ask); return; }

  if (t.id === "askSend") { submitAsk(); return; }
  if (t.id === "askStop") { Agent.stop(); return; }
  if (t.id === "askClear") { Agent.clear(); return; }

  if (t.id === "repPill" || t.id === "m_rep") { Rep.ask(); return; }
  if (t.id === "modePill") { tab = "method"; render(true); return; }

  if (t.dataset.delPrice) {
    const r = await Store.remove("prices", t.dataset.delPrice);
    if (!r.ok) flash("p_msg", r.why, "bad"); else render();
    return;
  }

  if (t.dataset.del) {
    const [coll, id] = t.dataset.del.split("|");
    const r = await Store.remove(coll, id);
    if (!r.ok) flash("n_msg", r.why, "bad"); else render();
    return;
  }

  if (t.id === "p_add") {
    const g = id => document.getElementById(id)?.value.trim() || "";
    if (!g("p_product")) { flash("p_msg", "Give the product a name first.", "bad"); return; }
    const res = await Store.add("prices", {
      product:g("p_product"), category:g("p_cat"), brand:g("p_brand"),
      country:g("p_country"), pack:g("p_pack"), price:g("p_price"),
      currency:g("p_cur"), source:g("p_source"), via:"manual"
    });
    if (!res.ok) { flash("p_msg", res.why, "bad"); return; }
    render();
    flash("p_msg", (Store.mode === "shared" ? "Logged and shared with the team." : "Logged on this device.") +
      (Rep.get() ? "" : " Set your name at the top so colleagues know whose figure this is."), "info");
    return;
  }

  if (t.id === "n_add") {
    const g = id => document.getElementById(id)?.value.trim() || "";
    if (!g("n_topic") || !g("n_body")) { flash("n_msg", "A topic and what happened, then it saves.", "bad"); return; }
    const res = await Store.add("notes", {
      topic:g("n_topic"), body:g("n_body"), competitor:g("n_comp"), via:"manual"
    });
    if (!res.ok) { flash("n_msg", res.why, "bad"); return; }
    render();
    flash("n_msg", "Note saved. The agent reads it on its next answer.", "info");
    return;
  }

  if (t.id === "p_export") {
    const rows = Store.data.prices;
    if (!rows.length) { flash("p_msg", "Nothing to export yet.", "bad"); return; }
    const cols = ["product","category","brand","country","pack","price","currency","source","rep","via"];
    const cell = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
    const csv = [cols.concat("logged").join(",")]
      .concat(rows.map(r => cols.map(c => cell(r[c]))
        .concat(cell(new Date(r.ts || Date.now()).toISOString().slice(0, 10))).join(",")))
      .join("\n");
    try {
      const dl = await window.claude?.use?.("downloads");
      if (!dl) { flash("p_msg", "Saving files is not available in this view.", "bad"); return; }
      await dl.save({ filename:"botiss-price-intel.csv", data:csv });
      flash("p_msg", "Exported.", "info");
    } catch (err) {
      flash("p_msg", err?.code === "declined" ? "Export cancelled." :
        "Export failed (" + (err?.code || "unknown") + ").", "bad");
    }
    return;
  }
});

document.addEventListener("input", e => {
  const k = e.target.dataset?.deal;
  if (!k) return;
  deal[k] = e.target.value;
  paintDeal();
});

/* boot */
Store.onChange(() => {
  paintPills();
  const livePages = tab === "desk" || tab === "prices" || tab === "learned" || tab === "method";
  if (livePages && !isTyping()) render();
});
paintPills();
render();
Store.connect();
Agent.init();
</script>

  };

  function banner() {

    '<div class="notice info" style="margin-bottom:16px">' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/>' +
        '<path d="M12 11v5.5"/><path d="M12 7.7v.4"/></svg>' +

      'color:inherit;font-weight:600;text-decoration:underline;cursor:pointer">' +

  const origRender = render;
  render = function (scrollTop) {

  /* ---------- 3. The agent tab becomes a worked example ------------ */

  let picked = "";

  const EXAMPLE = [

    host.innerHTML =
      '<div class="notice">' +

  };

  /* Tapping an example question should not pretend to ask it. */

    return head("Feedback", "Tell us what to change",

            'placeholder="Be blunt. Wrong figures, missing rivals, tabs you would never open, wording that would embarrass you in front of a clinician."></textarea></div>' +
        '</div>' +
        '<div style="display:flex;gap:9px;margin-top:13px;flex-wrap:wrap">' +
          '<button class="btn primary" id="fb_mail">Open in email</button>' +
          '<button class="btn" id="fb_copy">Copy my notes</button>' +
        '</div>' +
        '<div id="fb_msg" style="margin-top:10px" hidden></div>' +
      '</div>' +
      '<div class="notice info">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/>' +
          '<path d="M12 11v5.5"/><path d="M12 7.7v.4"/></svg>' +
        '<div>This file has no way to send anything by itself. <strong>Open in email</strong> starts a ' +
        'draft in your mail app with your notes already in it — you choose who it goes to. ' +
        '<strong>Copy my notes</strong> puts the text on your clipboard for Teams or WhatsApp.</div>' +
      '</div>' +
    '</div>';
  }

  function notesText() {
    const who = document.getElementById("fb_who")?.value.trim() || "(no name given)";
    const body = document.getElementById("fb_body")?.value.trim() || "";
    return "botiss CI Desk — preview feedback\nFrom: " + who + "\n\n" + body + "\n";
  }

  document.addEventListener("click", async e => {
    const t = e.target.closest("#fb_mail,#fb_copy");
    if (!t) return;
    e.preventDefault();
    e.stopPropagation();

    const body = document.getElementById("fb_body")?.value.trim() || "";
    if (!body) { flash("fb_msg", "Write a note first, then send it.", "bad"); return; }
    const text = notesText();

    if (t.id === "fb_mail") {
      /* No recipient on purpose: your mail app asks who it goes to. */
      const url = "mailto:?subject=" + encodeURIComponent("botiss CI Desk — preview feedback") +
                  "&body=" + encodeURIComponent(text.slice(0, 1600));
      window.location.href = url;
      flash("fb_msg", body.length > 1600
        ? "Draft opened, but long notes get cut by email links — use Copy my notes instead."
        : "Draft opened in your mail app. Add the recipient and send.", "info");
      return;
    }

    try {
      await navigator.clipboard.writeText(text);
      flash("fb_msg", "Copied. Paste it wherever suits you.", "info");
    } catch {
      const ta = document.getElementById("fb_body");
      ta?.focus(); ta?.select();
      flash("fb_msg", "Your browser blocked the clipboard here — the text is selected, press Ctrl+C (or Cmd+C).", "bad");
    }
  }, true);

  /* ---------- 5. Wire it in ---------------------------------------- */

  NAV.push({ id:"feedback", label:"Feedback", icon:"ask" });
  VIEWS.feedback = viewFeedback;

  /* Kept for the banner link and the example-question handler. */
  function tabTo(id) {
    const btn = document.querySelector('.navbtn[data-tab="' + id + '"]');
    if (btn) btn.click();
  }

  Agent.send = function () {};          /* nothing fake ever gets asked */
  Agent.done = true;
  Store.problem = null;

  paintPills();
  render();
})();

</script>
</body>
</html>
